{% extends "base.html" %}

{% block title %}
  <title>Signed Out | Bar Manager</title>
{% endblock %}

{% block layout %}
<div class="min-h-screen w-full flex items-center justify-center p-4 bg-gray-900">
  <div class="w-full max-w-md bg-gray-800 border border-gray-700/80 rounded-2xl shadow-2xl p-6 md:p-8 text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-green-500/20 border border-green-500/30 text-green-400 text-2xl mb-4 shadow-inner">
      ✓
    </div>
    <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Shift Ended</h1>
    <p class="text-sm text-gray-400 mb-6">
      You have successfully signed out of the Bar Manager portal.
    </p>

    <a href="{% url 'login' %}"
       class="inline-flex items-center justify-center gap-2 w-full px-5 py-3 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-800 rounded-xl shadow-lg shadow-blue-600/30 transition-all">
      <span>Sign In Again</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
    </a>
  </div>
</div>
{% endblock layout %}
