{% extends "base.html" %}
{% load i18n %}

{% block title %}
  <title>{% trans "Signed Out | Bar Manager" %}</title>
{% endblock %}

{% block layout %}
  <div class="auth-shell">
    <div class="auth-card" style="text-align: center;">
      <div class="auth-icon" style="border-color: rgba(16, 185, 129, 0.45); background: rgba(16, 185, 129, 0.16); color: #6ee7b7;">
        ✓
      </div>
      <h1>{% trans "Shift Ended" %}</h1>
      <p class="page-subtitle mb-6">
        {% trans "You have successfully signed out of the Bar Manager portal." %}
      </p>

      <a href="{% url 'login' %}" class="btn btn-primary btn-block">
        {% trans "Sign In Again" %} →
      </a>
    </div>
  </div>
{% endblock layout %}
