{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <div class="confirm-delete-card">
    <h1>{% trans "Delete Staff Member" %}</h1>
    <p class="page-subtitle mb-6">
      {% blocktrans with username=bartender.username %}Are you sure you want to delete staff account <strong>{{ username }}</strong>?{% endblocktrans %}
    </p>

    <form action="" method="post" class="inline-actions">
      {% csrf_token %}
      <button type="submit" class="btn btn-error">{% trans "Yes, delete" %}</button>
      <a href="{% url 'bar:bartender-detail' bartender.id %}" class="btn btn-outline">{% trans "Cancel" %}</a>
    </form>
  </div>
{% endblock %}
