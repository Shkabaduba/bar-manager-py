{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} Ingredient</h1>

  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <input type="submit" value="Submit" class="btn btn-primary mt-4">
    <a href="{% url 'bar:ingredient-list' %}" class="btn btn-outline mt-4">Cancel</a>
  </form>
{% endblock %}
