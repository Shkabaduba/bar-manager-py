{% extends "base.html" %}
{% load i18n %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>{% trans "Orders (POS)" %}</h1>
      <p class="page-subtitle">{% trans "Active table checks, bartender claims, and payment history" %}</p>
    </div>
    <a
      href="{% url 'bar:order-create' %}"
      hx-get="{% url 'bar:order-create' %}"
      hx-target="#drawer-body"
      hx-swap="innerHTML"
      class="btn btn-primary btn-sm"
    >
      + {% trans "Create Order" %}
    </a>
  </div>

  <form
    method="get"
    action=""
    hx-get="{% url 'bar:order-list' %}"
    hx-target="#order-list-region"
    hx-swap="outerHTML"
    hx-push-url="true"
    hx-trigger="submit, change from:select, change from:input"
    class="filter-bar"
  >
    <select name="status">
      <option value="">{% trans "All statuses" %}</option>
      <option value="ACTIVE" {% if selected_status == "ACTIVE" %}selected{% endif %}>{% trans "Active only" %}</option>
      {% for status_code, status_label in status_choices %}
        <option value="{{ status_code }}" {% if selected_status == status_code %}selected{% endif %}>
          {{ status_label }}
        </option>
      {% endfor %}
    </select>
    <label class="field-checkbox-row" style="padding: 0;">
      <input type="checkbox" name="mine" value="1" {% if request.GET.mine == "1" %}checked{% endif %}>
      <span class="field-checkbox-label">{% trans "My orders only" %}</span>
    </label>
    <button type="submit" class="btn btn-primary btn-sm">{% trans "Filter" %}</button>
  </form>

  {% include "bar/partials/order_table.html" %}
{% endblock %}

{% block pagination %}{% endblock %}
