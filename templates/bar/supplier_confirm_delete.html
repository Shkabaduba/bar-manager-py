{% extends "base.html" %}

{% block content %}
  <h1>Delete Supplier</h1>

  <p>Are you sure you want to delete supplier: <strong>{{ barsupplier.name }}</strong>?</p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-error mt-4">
    <a href="{% url 'bar:supplier-list' %}" class="btn btn-outline mt-4">Cancel</a>
  </form>
{% endblock %}
